apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: expense-db-secret
  namespace: dev
spec:
  refreshInterval: 1h

  secretStoreRef:
    name: aws-secret-store
    kind: SecretStore

  target:
    name: expense-db-secret
    creationPolicy: Owner

  data:
    - secretKey: DB_HOST
      remoteRef:
        key: expense-db-secrets
        property: DB_HOST

    - secretKey: DB_PORT
      remoteRef:
        key: expense-db-secrets
        property: DB_PORT

    - secretKey: DB_USER
      remoteRef:
        key: expense-db-secrets
        property: DB_USER

    - secretKey: DB_PASSWORD
      remoteRef:
        key: expense-db-secrets
        property: DB_PASSWORD

    - secretKey: DB_NAME
      remoteRef:
        key: expense-db-secrets
        property: DB_NAME
